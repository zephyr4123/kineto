name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 类型检查 + lint + 单测 + kineto check（CI 上没有素材二进制，只会出 ASSET_NOT_LOCAL 警告）
      - run: npm run verify
