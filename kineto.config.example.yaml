# kineto 配置示例（入库）。复制为 kineto.config.yaml（不入库）后按需修改；
# 不建 kineto.config.yaml 时全部取下面的默认值，零配置即可跑通。
# 密钥一律写成 ${ENV_NAME} 引用，永远不要把真实密钥写进任何配置文件。

# 可选：存放密钥的 dotenv 文件，放在仓库外、chmod 600。${ENV_NAME} 先查进程环境变量，找不到再查这个文件，
# 这样密钥不用全局 export，也不会出现在命令行和 shell 历史里。`./kineto doctor` 会检查它的权限。
# envFile: ~/.secrets/kineto.env

storage:
  # 存储后端：大文件（素材、渲染产物）放哪。local（默认）或 s3
  backend: local
  local:
    # 相对仓库根的目录，已被 .gitignore 忽略
    root: .kineto/store
  # S3 兼容的对象存储：腾讯云 COS、AWS S3、Cloudflare R2、阿里云 OSS、MinIO 都行，只差 endpoint。
  # 切换后跑一次 `./kineto storage push`，把本机已有的素材和渲染产物传上去。
  # s3:
  #   endpoint: https://cos.ap-shanghai.myqcloud.com     # COS：https://cos.<region>.myqcloud.com
  #   region: ap-shanghai
  #   bucket: <bucket-name>                              # COS 桶名带 APPID 后缀，如 kineto-1250000000
  #   prefix: ""                                         # 可选：对象都放在这个前缀下
  #   publicUrl: https://<your-cdn-domain>               # 可选：桶的公开访问根地址，渲染记录会给出可分享链接
  #   accessKeyId: ${KINETO_S3_ACCESS_KEY_ID}
  #   secretAccessKey: ${KINETO_S3_SECRET_ACCESS_KEY}
  #   forcePathStyle: false                              # MinIO 等自建服务通常要设 true

remotion:
  # Remotion 5.0 起渲染必须传 license key。个人 / ≤3 人公司 / 非营利填 free-license，
  # 其余见 https://remotion.pro/license
  licenseKey: free-license
